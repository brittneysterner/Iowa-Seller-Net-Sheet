<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Seller Net Sheet{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a href="{{ url_for('index') }}">Seller Net Sheet</a>
    <span class="spacer"></span>
    {% block nav %}{% endblock %}
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash {% if m.startswith('Please fix') %}bad{% endif %}">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
