[project]
name = "iowa-seller-net-sheet"
version = "0.1.0"
description = "Local seller net sheet app for Iowa real estate (Phase 1)"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0,<4",
  "reportlab>=4.0,<5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
